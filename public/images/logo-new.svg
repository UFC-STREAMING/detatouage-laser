<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Détatouage Laser France">
  <title>Détatouage Laser France</title>
  <desc>Logo professionnel pour clinique de détatouage laser</desc>

  <!-- Icône : symbole laser médical (cercle + rayon laser + point cible) -->
  <g id="icon" transform="translate(0, 0)">

    <!-- Cercle extérieur fin (contour médical) -->
    <circle cx="40" cy="40" r="30" fill="none" stroke="#2E5F8A" stroke-width="1.5" opacity="0.25"/>

    <!-- Arc supérieur (demi-cercle ouvert - esthétique clinique) -->
    <path d="M 18 28 A 25 25 0 0 1 62 28" fill="none" stroke="#2E5F8A" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Croix médicale stylisée en vert sauge -->
    <rect x="36.5" y="24" width="7" height="20" rx="1.5" fill="#4A7C6F"/>
    <rect x="30" y="30.5" width="20" height="7" rx="1.5" fill="#4A7C6F"/>

    <!-- Rayon laser diagonal (trait fin bleu depuis coin sup droit) -->
    <line x1="56" y1="22" x2="44" y2="34" stroke="#2E5F8A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Point laser (impact) -->
    <circle cx="44" cy="34" r="2" fill="#2E5F8A"/>

    <!-- Lignes de diffusion laser (effet onde) -->
    <line x1="58" y1="19" x2="63" y2="14" stroke="#2E5F8A" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="62" y1="24" x2="68" y2="21" stroke="#2E5F8A" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="61" y1="17" x2="64" y2="11" stroke="#2E5F8A" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  </g>

  <!-- Ligne de séparation verticale -->
  <line x1="82" y1="18" x2="82" y2="62" stroke="#2E5F8A" stroke-width="1" opacity="0.2"/>

  <!-- Texte principal -->
  <g id="text" transform="translate(94, 0)">

    <!-- "Détatouage" - ligne 1, bleu ardoise -->
    <text
      x="0"
      y="38"
      font-family="'Helvetica Neue', 'Arial', sans-serif"
      font-size="22"
      font-weight="700"
      letter-spacing="-0.3"
      fill="#2E5F8A"
    >Détatouage</text>

    <!-- "Laser" - ligne 2, vert sauge, légèrement plus petit -->
    <text
      x="0"
      y="58"
      font-family="'Helvetica Neue', 'Arial', sans-serif"
      font-size="16"
      font-weight="400"
      letter-spacing="3"
      fill="#4A7C6F"
    >LASER</text>

  </g>

  <!-- Trait de soulignement sous LASER (accent couleur) -->
  <line x1="94" y1="63" x2="194" y2="63" stroke="#4A7C6F" stroke-width="1" opacity="0.4"/>

</svg>
